<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TEG TV</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1a1a1a; color: #ffffff; overflow: hidden; }
        
        #mode-selector { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .btn { padding: 15px 30px; margin: 10px; font-size: 1.2rem; cursor: pointer; border: none; border-radius: 8px; background: #d32f2f; color: white; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #b71c1c; transform: scale(1.05); }

        /* PANTALLA DE TV (HOST) */
        #tv-container { display: none; width: 100vw; height: 100vh; position: relative; background: url('https://i.imgur.com/K1b5R9d.jpg') no-repeat center center; background-size: cover; }
        
        #tv-lobby { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.85); padding: 40px; border-radius: 15px; text-align: center; border: 2px solid #d32f2f; box-shadow: 0 0 30px rgba(0,0,0,0.8); width: 80%; max-width: 800px; backdrop-filter: blur(5px); }
        
        #qr-code { background: white; padding: 15px; margin: 20px auto; width: fit-content; border-radius: 10px; }
        .sala-codigo { font-size: 5rem; color: #ffeb3b; letter-spacing: 10px; margin: 10px 0; font-weight: bold; text-shadow: 2px 2px 5px #000; }
        
        #tv-connection-status { font-size: 2rem; color: #4caf50; margin-bottom: 20px; min-height: 70px; text-shadow: 1px 1px 3px #000; }
        
        #tv-players { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-top: 20px; min-height: 50px; }
        .player-badge { background: #d32f2f; padding: 10px 25px; border-radius: 20px; font-size: 1.5rem; font-weight: bold; box-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        
        #tv-game { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
        .tv-status-bar { background: rgba(0, 0, 0, 0.9); padding: 20px; text-align: center; font-size: 2rem; border-bottom: 3px solid #d32f2f; color: #fff; text-shadow: 2px 2px 4px #000; }

        .dado-resultado { background: rgba(30,30,30,0.9); padding: 30px; border-radius: 15px; text-align: center; width: 250px; border: 2px solid #555; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .dado-numero { font-size: 6rem; color: #ffeb3b; font-weight: bold; margin-top: 10px; }

        /* PANTALLA DE CELULAR (CLIENTE) */
        #mobile-container { display: none; width: 100vw; height: 100vh; flex-direction: column; background-color: #1e1e1e; }
        .mobile-header { background: #d32f2f; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; }
        .mobile-content { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        input[type="text"] { width: 100%; padding: 15px; font-size: 1.2rem; border-radius: 8px; border: 1px solid #555; background: #333; color: white; text-align: center; margin-bottom: 15px; }
        .card { background: #2c2c2c; padding: 20px; border-radius: 10px; border-left: 5px solid #d32f2f; }
        .status-msg { text-align: center; font-size: 1.5rem; color: #ffeb3b; margin: 20px 0; padding: 20px; background: rgba(255, 235, 59, 0.1); border-radius: 10px; }
        
        .action-btn { width: 100%; padding: 20px; font-size: 1.5rem; margin-bottom: 10px; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; color: white; }
        .btn-atacar { background: #d32f2f; }
        .btn-reagrupar { background: #1976d2; }
        .btn-pasar { background: #555; }
    </style>
</head>
<body>

    <div id="mode-selector">
        <h1 style="font-size: 4rem; margin-bottom: 10px; color: #d32f2f;">TEG</h1>
        <p style="margin-bottom: 30px; color: #aaa; font-size: 1.5rem;">Seleccioná el dispositivo</p>
        <button class="btn" id="btn-tv">Abrir en Televisor (Anfitrión)</button>
        <button class="btn" id="btn-mobile-manual" style="background: #1976d2;">Entrar desde Celular</button>
    </div>

    <!-- INTERFAZ TELEVISIÓN -->
    <div id="tv-container">
        <div id="tv-lobby">
            <div id="tv-connection-status">Esperando que se conecte el primer jugador...</div>
            <div style="display: flex; justify-content: center; align-items: center; gap: 40px;">
                <div id="qr-code"></div>
                <div>
                    <p style="font-size: 1.5rem; color: #ddd;">Código de Sala:</p>
                    <div class="sala-codigo" id="tv-sala-id">----</div>
                </div>
            </div>
            <div id="tv-players"></div>
            <button class="btn" id="btn-start-game" style="display:none; margin-top: 30px; font-size: 1.5rem; padding: 15px 40px; background: #4caf50;">Comenzar Partida</button>
        </div>
        
        <div id="tv-game">
            <div class="tv-status-bar" id="tv-status">Iniciando juego...</div>
            <div id="tv-dados-area" style="display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; margin-top: 60px; padding: 20px;"></div>
        </div>
    </div>

    <!-- INTERFAZ CELULAR -->
    <div id="mobile-container">
        <div class="mobile-header" id="mobile-header-title">TEG - Conectando...</div>
        <div class="mobile-content" id="mobile-login">
            <input type="text" id="mob-sala" placeholder="Código de Sala" maxlength="4" style="text-transform: uppercase;">
            <input type="text" id="mob-nombre" placeholder="Tu Nombre">
            <button class="btn" id="btn-join">Unirse a la partida</button>
        </div>
        <div class="mobile-content" id="mobile-game" style="display:none;">
            <div class="card">
                <h3 style="color: #ffeb3b; margin-bottom: 10px;">Tu Objetivo Secreto</h3>
                <p id="mob-objetivo">Cargando objetivo...</p>
            </div>
            <div id="mob-action-area">
                <div class="status-msg" id="mob-status-msg">Esperando a que el anfitrión inicie la partida...</div>
                <button class="btn" id="btn-roll-dice" style="display:none; width: 100%; background: #4caf50; font-size: 1.5rem; padding: 20px;">Tirar Dado para Empezar</button>
                
                <!-- Botones de turno (ocultos por defecto) -->
                <div id="mob-turn-actions" style="display:none; margin-top: 20px;">
                    <h3 style="text-align:center; margin-bottom: 15px; color: #4caf50;">¡ES TU TURNO!</h3>
                    <button class="action-btn btn-atacar">Atacar</button>
                    <button class="action-btn btn-reagrupar">Reagrupar Fichas</button>
                    <button class="action-btn btn-pasar" id="btn-pass-turn">Pasar Turno</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDnQsK7jNVciU2Ruo-mwELvFR97S6tNhgg",
            authDomain: "teg-tv.firebaseapp.com",
            projectId: "teg-tv",
            storageBucket: "teg-tv.firebasestorage.app",
            messagingSenderId: "735650643113",
            appId: "1:735650643113:web:e0ad00556934ce48773db8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentSala = "";
        let isHost = false;
        let playerId = "";
        let cantidadAnterior = 0;
        let transicionHecha = false;

        const urlParams = new URLSearchParams(window.location.search);
        const urlSala = urlParams.get('sala');

        if (urlSala) {
            document.getElementById('mode-selector').style.display = 'none';
            document.getElementById('mobile-container').style.display = 'flex';
            document.getElementById('mob-sala').value = urlSala;
            document.getElementById('mob-sala').disabled = true;
        }

        // LÓGICA HOST (TV)
        document.getElementById('btn-tv').addEventListener('click', async () => {
            isHost = true;
            document.getElementById('mode-selector').style.display = 'none';
            document.getElementById('tv-container').style.display = 'block';
            
            currentSala = Math.random().toString(36).substring(2, 6).toUpperCase();
            document.getElementById('tv-sala-id').innerText = currentSala;
            
            const gameUrl = window.location.href.split('?')[0] + "?sala=" + currentSala;
            new QRCode(document.getElementById("qr-code"), { text: gameUrl, width: 220, height: 220 });

            await setDoc(doc(db, "salas", currentSala), {
                estado: "lobby",
                jugadores: {},
                turnoActual: ""
            });

            onSnapshot(doc(db, "salas", currentSala), (docSnap) => {
                const data = docSnap.data();
                if(!data) return;
                
                const jugadoresData = Object.entries(data.jugadores || {});
                const cantidadActual = jugadoresData.length;
                const tvStatus = document.getElementById('tv-status');
                const dadosArea = document.getElementById('tv-dados-area');

                // ESTADO: LOBBY
                if (data.estado === "lobby") {
                    const playersDiv = document.getElementById('tv-players');
                    const statusDiv = document.getElementById('tv-connection-status');
                    playersDiv.innerHTML = "";
                    
                    jugadoresData.forEach(([id, j]) => {
                        playersDiv.innerHTML += `<div class="player-badge">${j.nombre}</div>`;
                    });

                    if (cantidadActual > cantidadAnterior) {
                        const ultimoJugador = jugadoresData[cantidadActual - 1][1].nombre;
                        statusDiv.innerHTML = `¡Se conectó <span style="color: #ffeb3b; font-weight: bold;">${ultimoJugador}</span>!<br><span style="font-size: 1.5rem; color: #ddd;">Esperando al que sigue...</span>`;
                    }
                    cantidadAnterior = cantidadActual;

                    if (cantidadActual >= 2) {
                        document.getElementById('btn-start-game').style.display = "inline-block";
                    }
                }

                // ESTADO: SORTEO DE DADOS
                if (data.estado === "sorteo") {
                    dadosArea.style.display = "flex";
                    dadosArea.innerHTML = "";
                    
                    let todosTiraron = true;
                    let numeroMaximo = 0;
                    let ganadorNombre = "";
                    let ganadorId = "";
                    let empate = false;

                    jugadoresData.forEach(([id, j]) => {
                        let valorDado = j.dadoSorteo > 0 ? j.dadoSorteo : "?";
                        dadosArea.innerHTML += `
                            <div class="dado-resultado">
                                <h2 style="font-size: 2rem;">${j.nombre}</h2>
                                <div class="dado-numero">${valorDado}</div>
                            </div>
                        `;

                        if (j.dadoSorteo === 0 || j.dadoSorteo === undefined) {
                            todosTiraron = false;
                        } else {
                            if (j.dadoSorteo > numeroMaximo) {
                                numeroMaximo = j.dadoSorteo;
                                ganadorNombre = j.nombre;
                                ganadorId = id;
                                empate = false;
                            } else if (j.dadoSorteo === numeroMaximo) {
                                empate = true;
                            }
                        }
                    });

                    if (todosTiraron) {
                        if (empate) {
                            tvStatus.innerHTML = `¡Empate con un <span style="color:#ffeb3b">${numeroMaximo}</span>! Vuelvan a tirar.`;
                            if (!transicionHecha) {
                                transicionHecha = true;
                                setTimeout(async () => {
                                    const resetJugadores = { ...data.jugadores };
                                    for (let id in resetJugadores) { resetJugadores[id].dadoSorteo = 0; }
                                    await updateDoc(doc(db, "salas", currentSala), { jugadores: resetJugadores });
                                    transicionHecha = false;
                                }, 3000);
                            }
                        } else {
                            tvStatus.innerHTML = `¡Tiros completados! Empieza a jugar: <strong style="color: #4caf50; font-size:2.5rem;">${ganadorNombre}</strong>`;
                            // Avanzar automáticamente a los turnos después de 4 segundos
                            if (!transicionHecha) {
                                transicionHecha = true;
                                setTimeout(async () => {
                                    await updateDoc(doc(db, "salas", currentSala), {
                                        estado: "turnos",
                                        turnoActual: ganadorId
                                    });
                                }, 4000);
                            }
                        }
                    } else {
                        tvStatus.innerText = "Revisen sus celulares. ¡Tiren el dado para ver quién empieza!";
                    }
                }

                // ESTADO: TURNOS DEL JUEGO
                if (data.estado === "turnos") {
                    dadosArea.style.display = "none";
                    const nombreJugadorActual = data.jugadores[data.turnoActual].nombre;
                    tvStatus.innerHTML = `TURNO ACTUAL: <strong style="color: #ffeb3b; font-size:2.5rem;">${nombreJugadorActual.toUpperCase()}</strong>`;
                }
            });
        });

        document.getElementById('btn-start-game').addEventListener('click', async () => {
            document.getElementById('tv-lobby').style.display = 'none';
            document.getElementById('tv-game').style.display = 'block';
            await updateDoc(doc(db, "salas", currentSala), { estado: "sorteo" });
        });

        // LÓGICA CLIENTE (CELULAR)
        document.getElementById('btn-mobile-manual').addEventListener('click', () => {
            document.getElementById('mode-selector').style.display = 'none';
            document.getElementById('mobile-container').style.display = 'flex';
        });

        document.getElementById('btn-join').addEventListener('click', async () => {
            currentSala = document.getElementById('mob-sala').value.toUpperCase();
            const nombre = document.getElementById('mob-nombre').value;
            if(!currentSala || !nombre) return alert("Completá tu nombre y código de sala");

            await signInAnonymously(auth);
            playerId = auth.currentUser.uid;
            
            document.getElementById('mobile-login').style.display = 'none';
            document.getElementById('mobile-game').style.display = 'flex';
            document.getElementById('mobile-header-title').innerText = "Jugador: " + nombre;

            const objetivos = [
                "Ocupar África y 5 países de América del Norte.",
                "Ocupar América del Sur, 7 países de Europa y 3 limítrofes.",
                "Ocupar Asia y 2 países de América del Sur."
            ];
            const miObjetivo = objetivos[Math.floor(Math.random() * objetivos.length)];
            document.getElementById('mob-objetivo').innerText = miObjetivo;

            const salaRef = doc(db, "salas", currentSala);
            await setDoc(salaRef, {
                jugadores: {
                    [playerId]: { nombre: nombre, objetivo: miObjetivo, dadoSorteo: 0 }
                }
            }, { merge: true });

            onSnapshot(salaRef, (docSnap) => {
                const data = docSnap.data();
                if(!data) return;

                const msgDiv = document.getElementById('mob-status-msg');
                const btnRoll = document.getElementById('btn-roll-dice');
                const turnActions = document.getElementById('mob-turn-actions');

                if (data.estado === "lobby") {
                    msgDiv.innerText = "¡Estás conectado! Esperando que el anfitrión inicie la partida...";
                    msgDiv.style.display = "block";
                    btnRoll.style.display = "none";
                    turnActions.style.display = "none";
                } else if (data.estado === "sorteo") {
                    turnActions.style.display = "none";
                    if (data.jugadores[playerId].dadoSorteo === 0) {
                        msgDiv.style.display = "none";
                        btnRoll.style.display = "block";
                    } else {
                        btnRoll.style.display = "none";
                        msgDiv.innerText = `Sacaste un ${data.jugadores[playerId].dadoSorteo}. ¡Mirá la TV!`;
                        msgDiv.style.display = "block";
                    }
                } else if (data.estado === "turnos") {
                    btnRoll.style.display = "none";
                    if (data.turnoActual === playerId) {
                        msgDiv.style.display = "none";
                        turnActions.style.display = "block";
                    } else {
                        turnActions.style.display = "none";
                        msgDiv.innerText = `Es el turno de ${data.jugadores[data.turnoActual].nombre}. Esperá a que termine.`;
                        msgDiv.style.display = "block";
                    }
                }
            });
        });

        // Botón de tirar dado
        document.getElementById('btn-roll-dice').addEventListener('click', async () => {
            const resultado = Math.floor(Math.random() * 6) + 1;
            const salaRef = doc(db, "salas", currentSala);
            await updateDoc(salaRef, {
                [`jugadores.${playerId}.dadoSorteo`]: resultado
            });
        });

        // Lógica para pasar el turno al siguiente jugador (Botón Pasar Turno)
        document.getElementById('btn-pass-turn').addEventListener('click', async () => {
            const salaRef = doc(db, "salas", currentSala);
            // Esto requerirá lógica adicional para rotar turnos después, por ahora avisa.
            alert("Has finalizado tu turno (Rotación de jugadores en desarrollo)");
        });
    </script>
</body>
</html>
