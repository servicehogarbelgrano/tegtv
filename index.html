<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TEG TV</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1a1a1a; color: #ffffff; overflow: hidden; }
        
        #mode-selector { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .btn { padding: 15px 30px; margin: 10px; font-size: 1.2rem; cursor: pointer; border: none; border-radius: 8px; background: #d32f2f; color: white; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #b71c1c; }

        /* PANTALLA DE TV */
        #tv-container { display: none; width: 100vw; height: 100vh; position: relative; background: url('https://i.imgur.com/K1b5R9d.jpg') no-repeat center center; background-size: cover; }
        #tv-lobby { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.85); padding: 40px; border-radius: 15px; text-align: center; border: 2px solid #d32f2f; width: 80%; max-width: 800px; backdrop-filter: blur(5px); }
        #qr-code { background: white; padding: 15px; margin: 20px auto; width: fit-content; border-radius: 10px; }
        .sala-codigo { font-size: 5rem; color: #ffeb3b; letter-spacing: 10px; margin: 10px 0; font-weight: bold; }
        #tv-connection-status { font-size: 2rem; color: #4caf50; margin-bottom: 20px; min-height: 70px; }
        #tv-players { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-top: 20px; min-height: 50px; }
        .player-badge { padding: 10px 25px; border-radius: 20px; font-size: 1.5rem; font-weight: bold; color: white; text-shadow: 1px 1px 2px #000; }
        
        #tv-game { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; flex-direction: column; }
        .tv-status-bar { background: rgba(0, 0, 0, 0.9); padding: 20px; text-align: center; font-size: 2rem; border-bottom: 3px solid #d32f2f; color: #fff; }
        
        /* TABLERO DE PAISES EN TV */
        #tv-tablero-paises { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-content: flex-start; }
        .pais-box { background: #333; border: 2px solid #555; border-radius: 8px; padding: 10px; width: 180px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .pais-nombre { font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; }
        .pais-fichas { font-size: 2rem; font-weight: bold; background: rgba(0,0,0,0.5); border-radius: 50%; width: 50px; height: 50px; line-height: 50px; margin: 0 auto; color: white; }

        .dado-resultado { background: rgba(30,30,30,0.9); padding: 30px; border-radius: 15px; text-align: center; width: 250px; border: 2px solid #555; }
        .dado-numero { font-size: 6rem; color: #ffeb3b; font-weight: bold; margin-top: 10px; }

        /* CELULAR */
        #mobile-container { display: none; width: 100vw; height: 100vh; flex-direction: column; background-color: #1e1e1e; }
        .mobile-header { background: #d32f2f; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; }
        .mobile-content { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 15px; font-size: 1.2rem; border-radius: 8px; border: 1px solid #555; background: #333; color: white; text-align: center; margin-bottom: 15px; }
        .card { background: #2c2c2c; padding: 20px; border-radius: 10px; border-left: 5px solid #d32f2f; }
        .status-msg { text-align: center; font-size: 1.5rem; color: #ffeb3b; margin: 20px 0; padding: 20px; background: rgba(255, 235, 59, 0.1); border-radius: 10px; }
        .action-btn { width: 100%; padding: 20px; font-size: 1.5rem; margin-bottom: 10px; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; color: white; }
    </style>
</head>
<body>

    <div id="mode-selector">
        <h1 style="font-size: 4rem; margin-bottom: 10px; color: #d32f2f;">TEG</h1>
        <p style="margin-bottom: 30px; color: #aaa; font-size: 1.5rem;">Seleccioná el dispositivo</p>
        <button class="btn" id="btn-tv">Abrir en Televisor (Anfitrión)</button>
        <button class="btn" id="btn-mobile-manual" style="background: #1976d2;">Entrar desde Celular</button>
    </div>

    <!-- PANTALLA TV -->
    <div id="tv-container">
        <div id="tv-lobby">
            <div id="tv-connection-status">Esperando jugadores...</div>
            <div style="display: flex; justify-content: center; gap: 40px;">
                <div id="qr-code"></div>
                <div><p style="font-size: 1.5rem;">Sala:</p><div class="sala-codigo" id="tv-sala-id">----</div></div>
            </div>
            <div id="tv-players"></div>
            <button class="btn" id="btn-start-game" style="display:none; margin-top: 30px; background: #4caf50;">Comenzar Partida</button>
        </div>
        
        <div id="tv-game">
            <div class="tv-status-bar" id="tv-status">Iniciando...</div>
            <div id="tv-dados-area" style="display: flex; justify-content: center; gap: 40px; margin-top: 60px;"></div>
            <div id="tv-tablero-paises" style="display: none;"></div>
        </div>
    </div>

    <!-- PANTALLA CELULAR -->
    <div id="mobile-container">
        <div class="mobile-header" id="mobile-header-title">TEG</div>
        <div class="mobile-content" id="mobile-login">
            <input type="text" id="mob-sala" placeholder="Código de Sala" maxlength="4" style="text-transform: uppercase;">
            <input type="text" id="mob-nombre" placeholder="Tu Nombre">
            <button class="btn" id="btn-join">Unirse</button>
        </div>
        <div class="mobile-content" id="mobile-game" style="display:none;">
            <div class="card"><h3 style="color:#ffeb3b;">Objetivo</h3><p id="mob-objetivo">Cargando...</p></div>
            <div id="mob-action-area">
                <div class="status-msg" id="mob-status-msg">Esperando al anfitrión...</div>
                <button class="action-btn" id="btn-roll-dice" style="display:none; background:#4caf50;">Tirar Dado</button>
                
                <div id="mob-turn-incorporacion" style="display:none; margin-top: 20px;">
                    <h3 style="text-align:center; color:#4caf50; margin-bottom:10px;">Fase de Incorporación</h3>
                    <p style="text-align:center; margin-bottom:15px;">Fichas disponibles: <strong id="mob-fichas-disponibles" style="color:#ffeb3b; font-size:1.5rem;">0</strong></p>
                    <select id="mob-select-pais"></select>
                    <input type="number" id="mob-input-fichas" placeholder="Cantidad de fichas" min="1">
                    <button class="action-btn" id="btn-colocar-fichas" style="background:#1976d2;">Colocar Fichas</button>
                </div>
            </div>
        </div>
    </div>
