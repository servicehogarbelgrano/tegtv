<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TEG TV</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1a1a1a; color: #ffffff; overflow: hidden; }
        
        #mode-selector { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .btn { padding: 15px 30px; margin: 10px; font-size: 1.2rem; cursor: pointer; border: none; border-radius: 8px; background: #d32f2f; color: white; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #b71c1c; }

        /* PANTALLA DE TV */
        #tv-container { display: none; width: 100vw; height: 100vh; position: relative; background: url('https://i.imgur.com/K1b5R9d.jpg') no-repeat center center; background-size: cover; }
        #tv-lobby { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.85); padding: 40px; border-radius: 15px; text-align: center; border: 2px solid #d32f2f; width: 80%; max-width: 800px; backdrop-filter: blur(5px); }
        #qr-code { background: white; padding: 15px; margin: 20px auto; width: fit-content; border-radius: 10px; }
        .sala-codigo { font-size: 5rem; color: #ffeb3b; letter-spacing: 10px; margin: 10px 0; font-weight: bold; }
        #tv-connection-status { font-size: 2rem; color: #4caf50; margin-bottom: 20px; min-height: 70px; }
        #tv-players { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-top: 20px; min-height: 50px; }
        .player-badge { padding: 10px 25px; border-radius: 20px; font-size: 1.5rem; font-weight: bold; color: white; text-shadow: 1px 1px 2px #000; }
        
        #tv-game { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; flex-direction: column; }
        .tv-status-bar { background: rgba(0, 0, 0, 0.9); padding: 20px; text-align: center; font-size: 2rem; border-bottom: 3px solid #d32f2f; color: #fff; }
        
        /* TABLERO DE PAISES EN TV */
        #tv-tablero-paises { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-content: flex-start; }
        .pais-box { background: #333; border: 2px solid #555; border-radius: 8px; padding: 10px; width: 180px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .pais-nombre { font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; }
        .pais-fichas { font-size: 2rem; font-weight: bold; background: rgba(0,0,0,0.5); border-radius: 50%; width: 50px; height: 50px; line-height: 50px; margin: 0 auto; color: white; }

        .dado-resultado { background: rgba(30,30,30,0.9); padding: 30px; border-radius: 15px; text-align: center; width: 250px; border: 2px solid #555; }
        .dado-numero { font-size: 6rem; color: #ffeb3b; font-weight: bold; margin-top: 10px; }

        /* CELULAR */
        #mobile-container { display: none; width: 100vw; height: 100vh; flex-direction: column; background-color: #1e1e1e; }
        .mobile-header { background: #d32f2f; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; }
        .mobile-content { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 15px; font-size: 1.2rem; border-radius: 8px; border: 1px solid #555; background: #333; color: white; text-align: center; margin-bottom: 15px; }
        .card { background: #2c2c2c; padding: 20px; border-radius: 10px; border-left: 5px solid #d32f2f; }
        .status-msg { text-align: center; font-size: 1.5rem; color: #ffeb3b; margin: 20px 0; padding: 20px; background: rgba(255, 235, 59, 0.1); border-radius: 10px; }
        .action-btn { width: 100%; padding: 20px; font-size: 1.5rem; margin-bottom: 10px; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; color: white; }
    </style>
</head>
<body>

    <div id="mode-selector">
        <h1 style="font-size: 4rem; margin-bottom: 10px; color: #d32f2f;">TEG</h1>
        <p style="margin-bottom: 30px; color: #aaa; font-size: 1.5rem;">Seleccioná el dispositivo</p>
        <button class="btn" id="btn-tv">Abrir en Televisor (Anfitrión)</button>
        <button class="btn" id="btn-mobile-manual" style="background: #1976d2;">Entrar desde Celular</button>
    </div>

    <!-- PANTALLA TV -->
    <div id="tv-container">
        <div id="tv-lobby">
            <div id="tv-connection-status">Esperando jugadores...</div>
            <div style="display: flex; justify-content: center; gap: 40px;">
                <div id="qr-code"></div>
                <div><p style="font-size: 1.5rem;">Sala:</p><div class="sala-codigo" id="tv-sala-id">----</div></div>
            </div>
            <div id="tv-players"></div>
            <button class="btn" id="btn-start-game" style="display:none; margin-top: 30px; background: #4caf50;">Comenzar Partida</button>
        </div>
        
        <div id="tv-game">
            <div class="tv-status-bar" id="tv-status">Iniciando...</div>
            <div id="tv-dados-area" style="display: flex; justify-content: center; gap: 40px; margin-top: 60px;"></div>
            <div id="tv-tablero-paises" style="display: none;"></div>
        </div>
    </div>

    <!-- PANTALLA CELULAR -->
    <div id="mobile-container">
        <div class="mobile-header" id="mobile-header-title">TEG</div>
        <div class="mobile-content" id="mobile-login">
            <input type="text" id="mob-sala" placeholder="Código de Sala" maxlength="4" style="text-transform: uppercase;">
            <input type="text" id="mob-nombre" placeholder="Tu Nombre">
            <button class="btn" id="btn-join">Unirse</button>
        </div>
        <div class="mobile-content" id="mobile-game" style="display:none;">
            <div class="card"><h3 style="color:#ffeb3b;">Objetivo</h3><p id="mob-objetivo">Cargando...</p></div>
            <div id="mob-action-area">
                <div class="status-msg" id="mob-status-msg">Esperando al anfitrión...</div>
                <button class="action-btn" id="btn-roll-dice" style="display:none; background:#4caf50;">Tirar Dado</button>
                
                <div id="mob-turn-incorporacion" style="display:none; margin-top: 20px;">
                    <h3 style="text-align:center; color:#4caf50; margin-bottom:10px;">Fase de Incorporación</h3>
                    <p style="text-align:center; margin-bottom:15px;">Fichas disponibles: <strong id="mob-fichas-disponibles" style="color:#ffeb3b; font-size:1.5rem;">0</strong></p>
                    <select id="mob-select-pais"></select>
                    <input type="number" id="mob-input-fichas" placeholder="Cantidad de fichas" min="1">
                    <button class="action-btn" id="btn-colocar-fichas" style="background:#1976d2;">Colocar Fichas</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDnQsK7jNVciU2Ruo-mwELvFR97S6tNhgg",
            authDomain: "teg-tv.firebaseapp.com",
            projectId: "teg-tv",
            storageBucket: "teg-tv.firebasestorage.app",
            messagingSenderId: "735650643113",
            appId: "1:735650643113:web:e0ad00556934ce48773db8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentSala = "";
        let isHost = false;
        let playerId = "";
        let transicionHecha = false;

        const COLORES = ["#d32f2f", "#1976d2", "#388e3c", "#fbc02d", "#8e24aa", "#f57c00"];
        const TODOS_LOS_PAISES = [
            "Argentina", "Brasil", "Chile", "Colombia", "Perú", "Uruguay", 
            "Alaska", "Yukón", "Canadá", "Groenlandia", "Oregón", "Nueva York", "Terranova", "Labrador", "California", "México",
            "Islandia", "Gran Bretaña", "España", "Francia", "Alemania", "Italia", "Polonia", "Rusia", "Suecia",
            "Aral", "Tartaria", "Taymir", "Siberia", "Kamchatka", "Japón", "Mongolia", "Irán", "Gobi", "China", "Malasia", "India", "Arabia", "Israel", "Turquía",
            "Sahara", "Zaire", "Etiopía", "Egipto", "Madagascar", "Sudáfrica",
            "Australia", "Borneo", "Java", "Sumatra"
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const urlSala = urlParams.get('sala');

        if (urlSala) {
            document.getElementById('mode-selector').style.display = 'none';
            document.getElementById('mobile-container').style.display = 'flex';
            document.getElementById('mob-sala').value = urlSala;
            document.getElementById('mob-sala').disabled = true;
        }

        // LÓGICA HOST (TV)
        document.getElementById('btn-tv').addEventListener('click', async () => {
            isHost = true;
            document.getElementById('mode-selector').style.display = 'none';
            document.getElementById('tv-container').style.display = 'block';
            
            currentSala = Math.random().toString(36).substring(2, 6).toUpperCase();
            document.getElementById('tv-sala-id').innerText = currentSala;
            
            document.getElementById("qr-code").innerHTML = ""; 
            new QRCode(document.getElementById("qr-code"), { text: window.location.href.split('?')[0] + "?sala=" + currentSala, width: 220, height: 220 });

            await setDoc(doc(db, "salas", currentSala), { estado: "lobby", jugadores: {}, paises: {}, turnoActual: "" });

            onSnapshot(doc(db, "salas", currentSala), async (docSnap) => {
                const data = docSnap.data();
                if(!data) return;
                
                const jugadoresData = Object.entries(data.jugadores || {});
                const tvStatus = document.getElementById('tv-status');

                if (data.estado === "lobby") {
                    const playersDiv = document.getElementById('tv-players');
                    playersDiv.innerHTML = "";
                    jugadoresData.forEach(([id, j]) => {
                        playersDiv.innerHTML += `<div class="player-badge" style="background:${j.color}">${j.nombre}</div>`;
                    });
                    if (jugadoresData.length >= 2) document.getElementById('btn-start-game').style.display = "inline-block";
                }

                if (data.estado === "sorteo") {
                    const dadosArea = document.getElementById('tv-dados-area');
                    dadosArea.style.display = "flex";
                    dadosArea.innerHTML = "";
                    
                    let todosTiraron = true;
                    let numeroMaximo = 0, ganadorNombre = "", ganadorId = "", empate = false;

                    jugadoresData.forEach(([id, j]) => {
                        let valorDado = j.dadoSorteo > 0 ? j.dadoSorteo : "?";
                        dadosArea.innerHTML += `<div class="dado-resultado" style="border-color:${j.color}"><h2 style="color:${j.color}">${j.nombre}</h2><div class="dado-numero">${valorDado}</div></div>`;
                        if (j.dadoSorteo === 0) todosTiraron = false;
                        else {
                            if (j.dadoSorteo > numeroMaximo) { numeroMaximo = j.dadoSorteo; ganadorNombre = j.nombre; ganadorId = id; empate = false; }
                            else if (j.dadoSorteo === numeroMaximo) empate = true;
                        }
                    });

                    if (todosTiraron && !transicionHecha) {
                        transicionHecha = true;
                        if (empate) {
                            tvStatus.innerHTML = `¡Empate! Relanzando dados...`;
                            setTimeout(async () => {
                                const resetJugadores = { ...data.jugadores };
                                for (let id in resetJugadores) resetJugadores[id].dadoSorteo = 0;
                                await updateDoc(doc(db, "salas", currentSala), { jugadores: resetJugadores });
                                transicionHecha = false;
                            }, 3000);
                        } else {
                            tvStatus.innerHTML = `Ganó <strong style="color:${data.jugadores[ganadorId].color}">${ganadorNombre}</strong>. Repartiendo países...`;
                            
                            let paisesMezclados = [...TODOS_LOS_PAISES].sort(() => Math.random() - 0.5);
                            let paisesAsignados = {};
                            let indexJugador = 0;
                            
                            paisesMezclados.forEach(pais => {
                                let idDuenio = jugadoresData[indexJugador][0];
                                paisesAsignados[pais] = { duenio: idDuenio, fichas: 1 };
                                indexJugador = (indexJugador + 1) % jugadoresData.length;
                            });

                            const updateJugadores = { ...data.jugadores };
                            updateJugadores[ganadorId].fichasParaColocar = 5;

                            setTimeout(async () => {
                                await updateDoc(doc(db, "salas", currentSala), { 
                                    estado: "incorporacion", 
                                    turnoActual: ganadorId,
                                    paises: paisesAsignados,
                                    jugadores: updateJugadores
                                });
                                transicionHecha = false;
                            }, 3000);
                        }
                    }
                }

                if (data.estado === "incorporacion") {
                    document.getElementById('tv-dados-area').style.display = "none";
                    const tablero = document.getElementById('tv-tablero-paises');
                    tablero.style.display = "flex";
                    tablero.innerHTML = "";
                    
                    const jActual = data.jugadores[data.turnoActual];
                    tvStatus.innerHTML = `Fase de Incorporación - Turno de: <strong style="color:${jActual.color}">${jActual.nombre}</strong> (Fichas restantes: ${jActual.fichasParaColocar})`;

                    Object.entries(data.paises).forEach(([nombrePais, info]) => {
                        const duenio = data.jugadores[info.duenio];
                        tablero.innerHTML += `
                            <div class="pais-box" style="border-color:${duenio.color}">
                                <div class="pais-nombre">${nombrePais}</div>
                                <div class="pais-fichas" style="background:${duenio.color}">${info.fichas}</div>
                            </div>
                        `;
                    });
                }
            });
        });

        document.getElementById('btn-start-game').addEventListener('click', async () => {
            document.getElementById('tv-lobby').style.display = 'none';
            document.getElementById('tv-game').style.display = 'flex';
            await updateDoc(doc(db, "salas", currentSala), { estado: "sorteo" });
        });

        // LÓGICA CLIENTE (CELULAR)
        document.getElementById('btn-mobile-manual').addEventListener('click', () => {
            document.getElementById('mode-selector').style.display = 'none';
            document.getElementById('mobile-container').style.display = 'flex';
        });

        document.getElementById('btn-join').addEventListener('click', async () => {
            currentSala = document.getElementById('mob-sala').value.toUpperCase();
            const nombre = document.getElementById('mob-nombre').value;
            if(!currentSala || !nombre) return;

            await signInAnonymously(auth);
            playerId = auth.currentUser.uid;
            
            document.getElementById('mobile-login').style.display = 'none';
            document.getElementById('mobile-game').style.display = 'flex';
            
            // GENERAR OBJETIVO
            const objetivos = [
                "Ocupar África y 5 países de América del Norte.",
                "Ocupar América del Sur, 7 países de Europa y 3 limítrofes.",
                "Ocupar Asia y 2 países de América del Sur."
            ];
            const miObjetivo = objetivos[Math.floor(Math.random() * objetivos.length)];
            document.getElementById('mob-objetivo').innerText = miObjetivo;

            const docSnapInit = await setDoc(doc(db, "salas", currentSala), {
                jugadores: {
                    [playerId]: { 
                        nombre: nombre, 
                        dadoSorteo: 0, 
                        fichasParaColocar: 0,
                        objetivo: miObjetivo,
                        color: COLORES[Math.floor(Math.random() * COLORES.length)]
                    }
                }
            }, { merge: true });

            onSnapshot(doc(db, "salas", currentSala), (docSnap) => {
                const data = docSnap.data();
                if(!data || !data.jugadores[playerId]) return;

                const msgDiv = document.getElementById('mob-status-msg');
                const btnRoll = document.getElementById('btn-roll-dice');
                const menuInc = document.getElementById('mob-turn-incorporacion');

                if (data.estado === "lobby") {
                    msgDiv.innerText = "Esperando al anfitrión...";
                    msgDiv.style.display = "block"; btnRoll.style.display = "none"; menuInc.style.display = "none";
                } 
                else if (data.estado === "sorteo") {
                    menuInc.style.display = "none";
                    if (data.jugadores[playerId].dadoSorteo === 0) {
                        msgDiv.style.display = "none"; btnRoll.style.display = "block";
                    } else {
                        btnRoll.style.display = "none"; msgDiv.innerText = `Sacaste ${data.jugadores[playerId].dadoSorteo}. Mirá la TV.`; msgDiv.style.display = "block";
                    }
                } 
                else if (data.estado === "incorporacion") {
                    btnRoll.style.display = "none";
                    if (data.turnoActual === playerId && data.jugadores[playerId].fichasParaColocar > 0) {
                        msgDiv.style.display = "none";
                        menuInc.style.display = "block";
                        document.getElementById('mob-fichas-disponibles').innerText = data.jugadores[playerId].fichasParaColocar;
                        document.getElementById('mob-input-fichas').max = data.jugadores[playerId].fichasParaColocar;
                        
                        const selectPais = document.getElementById('mob-select-pais');
                        selectPais.innerHTML = "";
                        Object.entries(data.paises).forEach(([nombrePais, info]) => {
                            if (info.duenio === playerId) {
                                selectPais.innerHTML += `<option value="${nombrePais}">${nombrePais} (Actual: ${info.fichas})</option>`;
                            }
                        });
                    } else {
                        menuInc.style.display = "none";
                        msgDiv.innerText = `Turno de ${data.jugadores[data.turnoActual].nombre}. Mirá la TV.`;
                        msgDiv.style.display = "block";
                    }
                }
            });
        });

        document.getElementById('btn-roll-dice').addEventListener('click', async () => {
            await updateDoc(doc(db, "salas", currentSala), { [`jugadores.${playerId}.dadoSorteo`]: Math.floor(Math.random() * 6) + 1 });
        });

        document.getElementById('btn-colocar-fichas').addEventListener('click', async () => {
            const paisSeleccionado = document.getElementById('mob-select-pais').value;
            const cantidad = parseInt(document.getElementById('mob-input-fichas').value);
            
            if(cantidad > 0 && cantidad <= parseInt(document.getElementById('mob-fichas-disponibles').innerText)){
                alert("Fichas colocadas en " + paisSeleccionado + ". (Lógica de resta a integrar en el próximo paso)");
            }
        });
    </script>
</body>
</html>
